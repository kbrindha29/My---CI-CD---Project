name: Create EC2 with CloudFormation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  create-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Repository Details
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::376775861131:role/GitHubActions-EC2-CICD
          aws-region: ap-south-1

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/ec2.yml

      - name: Create or update EC2 stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/ec2.yml \
            --stack-name github-actions-cicd-stack \
            --capabilities CAPABILITY_IAM
        - name: Deploy Website to EC2
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name github-actions-cicd-stack \
            --region ap-south-1 \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)

          echo "EC2 Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["curl -fsSL https://raw.githubusercontent.com/kbrindha29/My---CI-CD---Project/main/index.html -o /var/www/html/index.html","systemctl restart httpd"]' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-south-1 \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Website deployed successfully!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed!"
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out!"
          exit 1
